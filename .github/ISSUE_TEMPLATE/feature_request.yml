name: Feature request
description: Suggest a preset, an event, or an option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: Describe the situation where the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: |
        This project is deliberately small: a shell script, a PowerShell twin
        and some generated WAVs. Features that need a runtime dependency are
        unlikely to land.
      options:
        - label: This can be done without adding a runtime dependency.
